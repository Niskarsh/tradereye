name: Tmp tests
on: { push: { branches: [fix-claude-tmp-tests] } }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: npx --yes tsx@4 --test tests/levels.test.ts tests/algolive.test.ts
