# Same picks, protect the profit at 80-90%: replays saved F trades with fixed rules (lib/ml/profitLock.ts).
# Trains nothing and changes nothing Algo Live reads. The repo is public: the log prints progress only.
name: Profit lock

on:
  workflow_dispatch:
    inputs:
      iteration:
        description: Iteration whose trades to replay
        required: false
        default: '10'
  push:
    branches: [fix-claude-profit-lock]
    paths: [scripts/ml-profit-lock.ts, lib/ml/profitLock.ts, .github/workflows/profit-lock.yml]

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx --yes tsx@4 scripts/ml-profit-lock.ts
        env:
          ITERATION: ${{ inputs.iteration }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET_NAME: ${{ secrets.S3_BUCKET }}
          NODE_OPTIONS: --max-old-space-size=6144
