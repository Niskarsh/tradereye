# The setup backtest. Started only by the Re-run button on My Setups (tradereye calls GitHub's workflow_dispatch
# with a run id). It never runs on a schedule and never on pushes.
#
# The repo is public, so this log is public: the job prints progress only. The Dhan token is not an input (inputs are
# visible); tradereye leaves it in S3 under the run id and the job overwrites it the moment it has read it.
#
# Three stages: the backtest (writes the Algo Lab dataset), then the Algo Lab models on three machines at once (the main
# run, and the locked strategy trained twice more with other random draws for the noise check), then the finish (merge,
# trade-management experiment, upload, tag). Each job has its own time limit.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   DHAN_CLIENT_ID, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, S3_BUCKET
name: Setup backtest

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run id (set by tradereye's Re-run button)
        required: true
        type: string

concurrency:
  group: setups-backtest
  cancel-in-progress: false

permissions:
  contents: write  # only to tag the code of each Algo Lab iteration (algo-iter-<n>-<run>), so it can always be gone back to

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run the backtest
        run: npx --yes tsx@4 scripts/setups-backtest.ts
        env:
          RUN_ID: ${{ inputs.run_id }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET_NAME: ${{ secrets.S3_BUCKET }}
          NODE_OPTIONS: --max-old-space-size=9216
          ML_DIR: ml-data
      # the Algo Lab dataset, handed to the model jobs (never uploaded anywhere else; deleted after a day)
      - uses: actions/upload-artifact@v4
        with:
          name: grid
          path: ml-data/grid.*
          retention-days: 1
          compression-level: 1

  models:
    needs: backtest
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [main, seed2, seed3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: grid
          path: ml-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet numpy pandas scikit-learn
      - name: Algo Lab (walk-forward models, ${{ matrix.shard }})
        run: python scripts/ml_walkforward.py ml-data ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: ml-${{ matrix.shard }}
          path: ml-data/ml*.json
          retention-days: 1

  finish:
    needs: [backtest, models]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ml-*
          path: ml-data
          merge-multiple: true
      - name: Trade management, save the Algo Lab results and finish the run
        run: npx --yes tsx@4 scripts/ml-upload.ts
        env:
          RUN_ID: ${{ inputs.run_id }}
          ML_DIR: ml-data
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET_NAME: ${{ secrets.S3_BUCKET }}
          NODE_OPTIONS: --max-old-space-size=9216
      # keep the exact code of this Algo Lab iteration for good: a tag algo-iter-<iteration>-<run id>
      - name: Tag the code of this iteration
        if: success()
        continue-on-error: true  # a missing permission must never fail the run (the results are already saved)
        run: |
          N=$(python3 -c "import json;print(json.load(open('ml-data/ml.json'))['iteration'])")
          git tag "algo-iter-$N-${RUN_ID}" "$GITHUB_SHA"
          git push origin "algo-iter-$N-${RUN_ID}"
        env:
          RUN_ID: ${{ inputs.run_id }}
