# Algo Lab iteration 17: iteration 10 against learning from losses (B), chart structures (C), results days + sector (D), in
# every combination, each with and without break-even at 80% / 90%. Started only by the Run button on Algo Lab. Research
# only: its dataset is its own artifact ("grid-i17") and its results go only to the iteration ledger, so the normal backtest,
# My Setups and both Algo Live model workflows never see them.
#
# The repo is public, so this log is public: the jobs print progress only. The Dhan token is not an input; tradereye leaves
# it in S3 under the run id and the job overwrites it the moment it has read it.
name: Algo Lab iteration 17

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run id (set by tradereye's Run button)
        required: true
        type: string
      override:
        description: Keep running 08:40-11:15 on weekdays (slowed to 1 Dhan request a second there)
        required: false
        type: boolean
        default: false

concurrency:
  group: algo-lab-17
  cancel-in-progress: false

permissions:
  contents: write  # only to tag the code of this iteration

jobs:
  dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build the dataset
        run: npx --yes tsx@4 scripts/ml-iter17-grid.ts
        env:
          RUN_ID: ${{ inputs.run_id }}
          OVERRIDE: ${{ inputs.override }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET_NAME: ${{ secrets.S3_BUCKET }}
          NODE_OPTIONS: --max-old-space-size=9216
          ML_DIR: ml-data
      - uses: actions/upload-artifact@v4
        with:
          name: grid-i17
          path: |
            ml-data/grid.*
            ml-data/paths.*
            ml-data/i17-data.json
          retention-days: 3
          compression-level: 1

  models:
    needs: dataset
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        # A: the control (iteration 10) · C: + chart structures · D: + results days and sector · CD: both · Cp: C from random lines
        arm: [A, C, D, CD, Cp]
        shard: [main, seed2, seed3, seed4, seed5]
        exclude:  # the random-lines twin is compared on the main draw only
          - { arm: Cp, shard: seed2 }
          - { arm: Cp, shard: seed3 }
          - { arm: Cp, shard: seed4 }
          - { arm: Cp, shard: seed5 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: grid-i17
          path: ml-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet numpy pandas scikit-learn
      - name: Walk-forward models (${{ matrix.arm }}, ${{ matrix.shard }})
        run: python scripts/ml_iter17.py ml-data ${{ matrix.arm }} ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: i17-${{ matrix.arm }}-${{ matrix.shard }}
          path: ml-data/i17-${{ matrix.arm }}-${{ matrix.shard }}.json
          retention-days: 2

  finish:
    needs: [dataset, models]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: grid-i17
          path: ml-data
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: i17-*
          path: ml-data
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet numpy pandas scikit-learn
      - name: Learning from losses, break-even, the rule
        id: layers
        continue-on-error: true  # the finish step files what it can and says what failed
        run: python scripts/ml_iter17_layers.py ml-data
      - name: File the iteration
        run: npx --yes tsx@4 scripts/ml-iter17-upload.ts
        env:
          RUN_ID: ${{ inputs.run_id }}
          ML_DIR: ml-data
          LAYERS: ${{ steps.layers.outcome }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET_NAME: ${{ secrets.S3_BUCKET }}
      - name: Tag the code of this iteration
        if: success()
        continue-on-error: true
        run: |
          ITER=$(grep -oP '^ITERATION = \K\d+' scripts/ml_iter17.py)
          git tag "algo-iter-${ITER}-${RUN_ID}" "$GITHUB_SHA"
          git push origin "algo-iter-${ITER}-${RUN_ID}"
        env:
          RUN_ID: ${{ inputs.run_id }}
