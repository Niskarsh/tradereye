# Algo Live, the wide model: trains the model that trades this month for iteration 15's pick (scripts/ml_live_wide.py)
# from the dataset of the last Algo Lab wide run (its "grid-wide" artifact), checks the exported trees and the market gate
# reproduce Python, and saves it to S3 (setups/live/model-wide.json.gz; every one is also kept under setups/live/models-wide/).
# Algo Live trades it only when its page is switched to "Iteration 15 (wide)"; the narrow model and its workflow are untouched.
#
# When: once at the start of each month, after an Algo Lab Run has built the dataset (the Lab keeps it 7 days), or by hand
# from the Actions tab. The repo is public: the log prints progress only (results show as annotations).
name: Algo Live model (wide)

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Algo Lab wide run (GitHub run id) whose dataset to use; empty = the latest one that still has it
        required: false
        type: string
      month:
        description: Month to trade (YYYY-MM); empty = this month
        required: false
        type: string

concurrency:
  group: algo-live-model-wide
  cancel-in-progress: false

permissions:
  contents: read
  actions: read  # to read the dataset artifact of the Algo Lab run

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Find the dataset
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          if [ -n "$SOURCE_RUN" ]; then echo "run=$SOURCE_RUN" >> "$GITHUB_OUTPUT"; exit 0; fi
          # a run whose model jobs failed or timed out still has a good dataset: any completed run with the artifact counts
          for r in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/algo-lab-wide.yml/runs?status=completed&per_page=10" --jq '.workflow_runs[].id'); do
            n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$r/artifacts" --jq '[.artifacts[] | select(.name=="grid-wide" and .expired==false)] | length')
            if [ "$n" = "1" ]; then echo "run=$r" >> "$GITHUB_OUTPUT"; echo "dataset from run $r"; exit 0; fi
          done
          echo "::error title=No dataset::No Algo Lab wide run still has its dataset: press Run on Algo Lab first (it keeps the dataset 7 days)." && exit 1
      - uses: actions/download-artifact@v4
        with:
          name: grid-wide
          path: ml-data
          run-id: ${{ steps.src.outputs.run }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet numpy pandas scikit-learn
      - name: Train this month's model and export it
        run: python scripts/ml_live_wide.py ml-data "${{ inputs.month }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The live engine scores it and works out the gate exactly as Python did
        run: |
          set +e
          npx --yes tsx@4 scripts/ml-live-check.ts ml-data/live-model.json > check.txt 2>&1
          code=$?
          cat check.txt
          if [ $code -ne 0 ]; then echo "::error title=Live engine check failed::$(tail -c 1200 check.txt | tr '\n' ' ')"; exit 1; fi
      - name: Save it to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          gzip -9 -k ml-data/live-model.json
          M=$(python3 -c "import json;print(json.load(open('ml-data/live-model.json'))['month'])")
          aws s3 cp ml-data/live-model.json.gz "s3://$BUCKET/setups/live/models-wide/$M-$GITHUB_RUN_ID.json.gz" --only-show-errors
          aws s3 cp ml-data/live-model.json.gz "s3://$BUCKET/setups/live/model-wide.json.gz" --only-show-errors
          python3 -c "import json;m=json.load(open('ml-data/live-model.json'));print('::notice title=Algo Live model (wide)::iteration', m['iteration'], m['strategyName'], '| month', m['month'], '| learned', m['train'], '| bar set on', m['val'], '|', 'STAND ASIDE' if m['standAside'] else 'trading', '| bar', m['threshold'], '| validation', m['valTrades'], 'trades in', m['valDays'], 'days,', m['valR'], 'R a trade | sklearn parity', m['parity']['worst'], '| hot days kept', len(m['gate']['hot']), '| data to', m['dataTo'])"
